description: |
  Analog Devices MAX20356/MAX20358 PMIC watchdog.

  Child node of the MAX20356 MFD parent. Exposes the standard Zephyr watchdog
  API; the timeout window and reset behavior are set at runtime through the wdt
  API, so no special devicetree properties are required.

compatible: "adi,max20356-watchdog"

include: base.yaml

description: |
  Analog Devices MAX20356/MAX20358 PMIC battery charger.

  Child node of the MAX20356 MFD parent. Exposes the standard Zephyr charger API
  (enable/disable, fast-charge current, battery regulation voltage, status,
  health and online reporting). JEITA thermal configuration is applied at init
  from the properties below; runtime zone changes are hardware-managed and
  reported through the charger health/status properties.

compatible: "adi,max20356-charger"

include: battery.yaml

properties:
  constant-charge-current-microamp:
    type: int
    description: |
      Fast-charge (CC) current in microamps (ChgCur0.CC1IFChg), 4000..500000.
      Values outside the supported range are rejected at runtime.

  constant-charge-voltage-microvolt:
    type: int
    description: |
      Battery regulation (charge-termination) voltage in microvolts
      (ChgCntl1.ChgBatReg).
